{% extends 'base.html' %}
{% block title %}Login - Docify Online{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-sm-5 app-surface">
            <div class="text-center mb-4">
                <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-3" style="width: 70px; height: 70px;">
                    <i class="fas fa-sign-in-alt fs-2"></i>
                </div>
                <h2 class="h3 fw-bold text-dark mb-1">Welcome Back</h2>
                <p class="text-muted small">Sign in to access your medical dashboard</p>
            </div>

            <form method="POST" class="needs-validation">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted">
                        <i class="fas fa-envelope text-primary me-1"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        name="email" 
                        class="form-control rounded-3 p-3 shadow-xs border-light-subtle" 
                        placeholder="Enter your email"
                        required
                    >
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted">
                        <i class="fas fa-lock text-primary me-1"></i> Password
                    </label>
                    <input 
                        type="password" 
                        name="password" 
                        class="form-control rounded-3 p-3 shadow-xs border-light-subtle" 
                        placeholder="Enter your password"
                        required
                    >
                </div>
                
                <button 
                    type="submit" 
                    class="btn btn-primary-grad w-100 py-3 rounded-3 fw-bold d-flex align-items-center justify-content-center gap-2"
                >
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Sign In</span>
                </button>
            </form>

            <div class="mt-4 text-center">
                <p class="text-muted small mb-0">Don't have an account yet? 
                    <a href="{{ url_for('auth.register') }}" class="text-primary fw-bold text-decoration-none">
                        Register here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
