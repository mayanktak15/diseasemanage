{% extends 'base.html' %}
{% block title %}Register - Docify Online{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-sm-5 app-surface">
            <div class="text-center mb-4">
                <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-3" style="width: 70px; height: 70px;">
                    <i class="fas fa-user-plus fs-2"></i>
                </div>
                <h2 class="h3 fw-bold text-dark mb-1">Create Account</h2>
                <p class="text-muted small">Register to get medical consultations online</p>
            </div>

            <form method="POST" class="needs-validation">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted">
                        <i class="fas fa-user text-primary me-1"></i> Full Name
                    </label>
                    <input 
                        type="text" 
                        name="name" 
                        class="form-control rounded-3 p-3 shadow-xs border-light-subtle" 
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted">
                        <i class="fas fa-phone text-primary me-1"></i> Phone Number
                    </label>
                    <input 
                        type="tel" 
                        name="phone" 
                        class="form-control rounded-3 p-3 shadow-xs border-light-subtle" 
                        placeholder="Enter your contact number"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted">
                        <i class="fas fa-envelope text-primary me-1"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        name="email" 
                        class="form-control rounded-3 p-3 shadow-xs border-light-subtle" 
                        placeholder="Enter your email address"
                        required
                    >
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted">
                        <i class="fas fa-lock text-primary me-1"></i> Password
                    </label>
                    <input 
                        type="password" 
                        name="password" 
                        class="form-control rounded-3 p-3 shadow-xs border-light-subtle" 
                        placeholder="Create password"
                        required
                    >
                </div>
                
                <button 
                    type="submit" 
                    class="btn btn-primary-grad w-100 py-3 rounded-3 fw-bold d-flex align-items-center justify-content-center gap-2"
                >
                    <i class="fas fa-user-plus"></i>
                    <span>Register</span>
                </button>
            </form>

            <div class="mt-4 text-center">
                <p class="text-muted small mb-0">Already have an account? 
                    <a href="{{ url_for('auth.login') }}" class="text-primary fw-bold text-decoration-none">
                        Login here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
