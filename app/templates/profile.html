{% extends 'base.html' %}
{% block title %}Profile - Docify Online{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-sm-5 app-surface">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="bg-primary text-white p-3 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px;">
                    <i class="fas fa-id-card fs-3"></i>
                </div>
                <div>
                    <h2 class="h3 fw-bold text-dark mb-0">My Health Profile</h2>
                    <p class="text-muted small mb-0">Complete your details to help our medical practitioners evaluate your consultations</p>
                </div>
            </div>

            <form method="POST" class="needs-validation">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <h4 class="h6 text-primary fw-bold text-uppercase border-bottom border-light pb-2 mb-3">General Information</h4>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-muted small">Full Name</label>
                        <input type="text" name="name" value="{{ user.name }}" class="form-control rounded-3 p-3 border-light-subtle shadow-xs" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-muted small">Phone Number</label>
                        <input type="tel" name="phone" value="{{ user.phone }}" class="form-control rounded-3 p-3 border-light-subtle shadow-xs" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-muted small">Age</label>
                        <input type="number" name="age" value="{{ user.age or '' }}" class="form-control rounded-3 p-3 border-light-subtle shadow-xs" placeholder="e.g. 30">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-muted small">Gender</label>
                        <select name="gender" class="form-select rounded-3 p-3 border-light-subtle shadow-xs">
                            <option value="">Select Gender</option>
                            <option value="Male" {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if user.gender == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold text-muted small">Blood Group</label>
                        <select name="blood_group" class="form-select rounded-3 p-3 border-light-subtle shadow-xs">
                            <option value="">Select Group</option>
                            {% for bg in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                            <option value="{{ bg }}" {% if user.blood_group == bg %}selected{% endif %}>{{ bg }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <h4 class="h6 text-primary fw-bold text-uppercase border-bottom border-light pb-2 mb-3">Clinical Context</h4>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Allergies</label>
                    <textarea name="allergies" rows="2" class="form-control rounded-3 p-3 border-light-subtle shadow-xs" placeholder="Specify any drug, food, or environmental allergies...">{{ user.allergies or '' }}</textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Chronic Medical History</label>
                    <textarea name="medical_history" rows="3" class="form-control rounded-3 p-3 border-light-subtle shadow-xs" placeholder="List any chronic conditions, surgeries, or long-term medications...">{{ user.medical_history or '' }}</textarea>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-primary-grad px-5 py-3 rounded-3 fw-bold flex-fill">
                        <i class="fas fa-save me-2"></i> Save Changes
                    </button>
                    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-outline-secondary px-4 py-3 rounded-3 fw-bold">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
