{% extends 'base.html' %}
{% block title %}Update Consultation - Docify Online{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-sm-5 app-surface">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="bg-primary text-white p-3 rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px;">
                    <i class="fas fa-edit fs-3"></i>
                </div>
                <div>
                    <h2 class="h3 fw-bold text-dark mb-0">Update Consultation</h2>
                    <p class="text-muted small mb-0">Modify the description of your symptoms for review</p>
                </div>
            </div>

            <form method="POST" class="needs-validation">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted mb-2">
                        <i class="fas fa-notes-medical text-primary me-2"></i>Describe Your Symptoms
                    </label>
                    <textarea 
                        name="symptoms" 
                        rows="6" 
                        class="form-control rounded-3 p-3 border-light-subtle shadow-xs" 
                        required
                    >{{ consultation.symptoms }}</textarea>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-primary-grad px-5 py-3 rounded-3 fw-bold flex-fill">
                        <i class="fas fa-check-circle me-2"></i> Update Consultation
                    </button>
                    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-outline-secondary px-4 py-3 rounded-3 fw-bold">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
